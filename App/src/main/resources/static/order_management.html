<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout & Orders | SalesSavvy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: #0f172a;
      color: #ffffff;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
    }

    .brand-logo span {
      color: #3b82f6;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav {
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-outline {
      background: #1e293b;
      color: #ffffff;
    }

    .btn-outline:hover {
      background: #334155;
    }

    .btn-logout {
      background: #ef4444;
      color: #ffffff;
    }

    .btn-logout:hover {
      background: #dc2626;
    }

    /* Main Container */
    .container {
      width: 92%;
      max-width: 1200px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 920px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Cards */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.05);
      margin-bottom: 24px;
    }

    h1, h2, h3 {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Table */
    .order-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .order-table th {
      text-align: left;
      padding: 10px;
      font-size: 13px;
      color: #64748b;
      border-bottom: 2px solid #e2e8f0;
      background: #f8fafc;
    }

    .order-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success {
      background: #dcfce7;
      color: #166534;
    }

    /* Notification Banner */
    .banner {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 18px;
      font-weight: 500;
    }

    .banner.error {
      background: #fee2e2;
      color: #991b1b;
      border-left: 4px solid #ef4444;
    }

    .banner.success {
      background: #dcfce7;
      color: #166534;
      border-left: 4px solid #16a34a;
    }

    /* Summary Bar */
    .summary-card {
      position: sticky;
      top: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
      color: #475569;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    .btn-place-order {
      width: 100%;
      height: 44px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      transition: background 0.2s;
    }

    .btn-place-order:hover {
      background: #1d4ed8;
    }

    .btn-place-order:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="user_home.html" class="brand-logo">Sales<span>Savvy</span></a>
    <div class="nav-links">
      <a href="cart_management.html" class="btn-nav btn-outline">Back to Cart</a>
      <a href="view_product.html" class="btn-nav btn-outline">Products</a>
      <button onclick="logout()" class="btn-nav btn-logout">Logout</button>
    </div>
  </header>

  <div class="container">
    <!-- Left Column: Shipping Address & Review Items -->
    <div>
      <div id="statusBanner" class="banner"></div>

      <!-- Step 1: Shipping Details -->
      <div class="card">
        <h2>1. Delivery Address & Contact</h2>
        <div class="form-group">
          <label for="shippingAddress">Full Shipping Address</label>
          <textarea id="shippingAddress" placeholder="House/Flat No., Street, City, State, PIN Code" required></textarea>
        </div>
        <div class="form-group">
          <label for="contactMobile">Contact Mobile Number</label>
          <input type="text" id="contactMobile" placeholder="e.g. 9876543210" required />
        </div>
        <div class="form-group">
          <label for="paymentMethod">Payment Method</label>
          <select id="paymentMethod">
            <option value="COD">Cash on Delivery (COD)</option>
            <option value="UPI">UPI / Net Banking</option>
            <option value="CARD">Credit / Debit Card</option>
          </select>
        </div>
      </div>

      <!-- Step 2: Order Items from Cart -->
      <div class="card">
        <h2>2. Review Cart Items</h2>
        <div id="itemsReview">
          <p style="color: #64748b;">Loading order items...</p>
        </div>
      </div>

      <!-- Step 3: Past Orders History -->
      <div class="card">
        <h2>Your Past Orders</h2>
        <div id="ordersHistory">
          <p style="color: #64748b;">Loading recent orders...</p>
        </div>
      </div>
    </div>

    <!-- Right Column: Price Summary & Place Order -->
    <div class="card summary-card">
      <h3>Order Summary</h3>
      <div class="summary-row">
        <span>Items Total:</span>
        <span id="summarySubtotal">&#8377;0.00</span>
      </div>
      <div class="summary-row">
        <span>Delivery Fee:</span>
        <span style="color: #16a34a; font-weight: 600;">FREE</span>
      </div>
      <div class="summary-total">
        <span>Order Total:</span>
        <span id="summaryTotal">&#8377;0.00</span>
      </div>

      <button id="placeOrderBtn" onclick="placeOrder()" class="btn-place-order">
        Place Your Order
      </button>
    </div>
  </div>

  <script>
    const CART_API = '/customer/cart';
    const ORDER_API = '/customer/orders';

    function getAuthHeaders() {
      const headers = { 'Content-Type': 'application/json' };
      const token = localStorage.getItem('token');
      if (token) headers['Authorization'] = `Bearer ${token}`;
      return headers;
    }

    // 1. Fetch Cart to review items before checkout
    async function loadCartSummary() {
      try {
        const response = await fetch(CART_API, {
          method: 'GET',
          headers: getAuthHeaders(),
          credentials: 'include'
        });

        if (response.status === 401 || response.status === 403) {
          showBanner('Please sign in to complete checkout.', 'error');
          setTimeout(() => window.location.href = 'login.html', 1500);
          return;
        }

        const cart = await response.json();
        const items = cart.items || [];
        const total = cart.totalAmount || 0;

        document.getElementById('summarySubtotal').innerHTML = `&#8377;${Number(total).toFixed(2)}`;
        document.getElementById('summaryTotal').innerHTML = `&#8377;${Number(total).toFixed(2)}`;

        const container = document.getElementById('itemsReview');
        if (items.length === 0) {
          container.innerHTML = `<p style="color:#64748b;">Your cart is empty. <a href="view_product.html" style="color:#2563eb;">Add products</a> before checking out.</p>`;
          document.getElementById('placeOrderBtn').disabled = true;
          return;
        }

        let html = `
          <table class="order-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Subtotal</th>
              </tr>
            </thead>
            <tbody>
        `;

        items.forEach(item => {
          html += `
            <tr>
              <td><strong>${item.productName || 'Product #' + item.productId}</strong></td>
              <td>&#8377;${Number(item.price).toFixed(2)}</td>
              <td>${item.quantity}</td>
              <td><strong>&#8377;${Number(item.subtotal).toFixed(2)}</strong></td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

      } catch (err) {
        showBanner('Error loading cart: ' + err.message, 'error');
      }
    }

    // 2. Place Order from Cart
    async function placeOrder() {
      const address = document.getElementById('shippingAddress').value.trim();
      const mobile = document.getElementById('contactMobile').value.trim();
      const paymentMethod = document.getElementById('paymentMethod').value;
      const btn = document.getElementById('placeOrderBtn');

      if (!address) {
        showBanner('Please enter a delivery address.', 'error');
        return;
      }

      if (!mobile) {
        showBanner('Please enter a contact mobile number.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Processing Order...';

      const payload = {
        shippingAddress: address,
        contactMobile: mobile,
        paymentMethod: paymentMethod
      };

      try {
        const response = await fetch(ORDER_API, {
          method: 'POST',
          headers: getAuthHeaders(),
          credentials: 'include',
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({ message: 'Failed to place order.' }));
          throw new Error(errData.message || 'Server error placing order.');
        }

        const orderResult = await response.json();
        showBanner(`Order #${orderResult.orderId || orderResult.id || 'SUCCESS'} placed successfully!`, 'success');

        // Refresh UI
        setTimeout(() => {
          loadCartSummary();
          loadOrderHistory();
        }, 1200);

      } catch (err) {
        showBanner(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Place Your Order';
      }
    }

    // 3. Load past order history
    async function loadOrderHistory() {
      const container = document.getElementById('ordersHistory');
      try {
        const response = await fetch(ORDER_API, {
          method: 'GET',
          headers: getAuthHeaders(),
          credentials: 'include'
        });

        if (!response.ok) {
          container.innerHTML = `<p style="color:#64748b;">No recent order records found.</p>`;
          return;
        }

        const orders = await response.json();
        if (!orders || orders.length === 0) {
          container.innerHTML = `<p style="color:#64748b;">You have not placed any orders yet.</p>`;
          return;
        }

        let html = `
          <table class="order-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Date</th>
                <th>Status</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
        `;

        orders.forEach(ord => {
          html += `
            <tr>
              <td>#${ord.id}</td>
              <td>${ord.orderDate ? ord.orderDate.substring(0, 10) : 'Recent'}</td>
              <td><span class="badge badge-success">${ord.status || 'PLACED'}</span></td>
              <td><strong>&#8377;${Number(ord.totalAmount).toFixed(2)}</strong></td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = `<p style="color:#64748b;">Unable to load order history.</p>`;
      }
    }

    function showBanner(message, type) {
      const banner = document.getElementById('statusBanner');
      banner.textContent = message;
      banner.className = `banner ${type}`;
      banner.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => { banner.style.display = 'none'; }, 5000);
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      sessionStorage.clear();
      window.location.href = 'login.html';
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadCartSummary();
      loadOrderHistory();
    });
  </script>
</body>
</html>
