<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update User</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f8fafc;color:#1e293b}
header{background:#0f172a;color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:24px}
.btn-link{background:#2563eb;color:white;text-decoration:none;padding:8px 14px;border-radius:6px;font-weight:bold}
.container{width:90%;max-width:600px;margin:25px auto;background:white;padding:20px;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
h2{margin:0 0 18px;font-size:20px}
.form-group{margin-bottom:12px}
label{display:block;margin-bottom:5px;font-weight:bold}
input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px}
button{background:#16a34a;color:white;border:0;padding:10px 16px;border-radius:6px;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}
.message{margin-top:15px;padding:10px;border-radius:6px;background:#dcfce7;color:#166534;font-weight:bold}
.error{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<header>
<h1>Update User</h1>
<a class="btn-link" href="user_management.html">Back</a>
</header>

<div class="container">
<h2>Update Profile</h2>

<div class="form-group">
<label>User ID</label>
<input type="text" id="id" readonly>
</div>

<div class="form-group">
<label>Username</label>
<input type="text" id="username">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email">
</div>

<div class="form-group">
<label>New Password</label>
<input type="password" id="password">
</div>

<div class="form-group">
<label>Mobile</label>
<input type="text" id="mobile">
</div>

<div class="form-group">
<label>DOB</label>
<input type="date" id="dob">
</div>

<div class="form-group">
<label>Gender</label>
<select id="gender">
<option value="MALE">Male</option>
<option value="FEMALE">Female</option>
<option value="OTHERS">Other</option>
</select>
</div>

<div class="form-group">
<label>Address</label>
<input type="text" id="address">
</div>

<div class="form-group">
<label>Profile URL</label>
<input type="text" id="dpUr">
</div>

<button onclick="updateUser()">Update Profile</button>

<div id="messageArea"></div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
const id=params.get("id");

document.getElementById("id").value=id;

async function updateUser(){
    const user={
        username:document.getElementById("username").value,
        email:document.getElementById("email").value,
        password:document.getElementById("password").value,
        mobile:document.getElementById("mobile").value,
        dob:document.getElementById("dob").value,
        gender:document.getElementById("gender").value,
        address:document.getElementById("address").value,
        dpUr:document.getElementById("dpUr").value
    };

    try{
        const response=await fetch(`/updateUser/${id}`,{
            method:"PUT",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(user)
        });

        const result=await response.text();

        if(response.ok){
            document.getElementById("messageArea").innerHTML='<div class="message">User updated successfully</div>';
        }else{
            document.getElementById("messageArea").innerHTML=`<div class="message error">${result}</div>`;
        }
    }catch(error){
        console.error(error);
        document.getElementById("messageArea").innerHTML='<div class="message error">Server connection failed.</div>';
    }
}
</script>

</body>
</html>
