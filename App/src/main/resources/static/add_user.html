<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Profile</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f8fafc; }
        header {
            background: #0f172a;
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-link {
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
        }
        .container {
            width: 90%;
            max-width: 600px;
            margin: 35px auto;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }
        textarea { min-height: 90px; resize: vertical; }
        button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #dcfce7;
            color: #166534;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Add Profile</h1>
        <a class="btn-link" href="user_management.html">Back</a>
    </header>

    <div class="container">
        <h2>Enter Profile Details</h2>

        <div class="form-group">
            <label>Name</label>
            <input type="text" id="username" placeholder="Enter your username"/>
        </div>

         <div class="form-group">
            <label>Email</label>
            <input type="text" id="email" placeholder="Enter your email"/>
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password"/>
        </div>
        
        <div class="form-group">
            <label>Mobile</label>
            <input type="number" id="number" />
        </div>
        
        <div class="form-group">
            <label>DOB</label>
            <input type="date" id="date" />
        </div>
  
        
        <div class="form-group">
            <label>Gender</label>
            <select id="gender" name="gender" placeholder="Select your role">
            <option value="MALE">Male</option>
            <option value="MALE">Female</option>
            <option value="OTHERS">Other</option>
             </select>
         </div>
        
        <div class="form-group">
            <label>Address</label>
            <input type="text" id="address" />
        </div>
        
        <div class="form-group">
            <label>Profile Url</label>
            <input type="text" id="dpUr" />
        </div>
        
        <button onclick="register()"> Register User</button>
        
    </div>

     
<script>
    async function register() {

        const user = {
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            mobile: document.getElementById("number").value,
            dob: document.getElementById("date").value,
            gender: document.getElementById("gender").value,
            address: document.getElementById("address").value,
            dpUr: document.getElementById("dpUr").value
        };

        try {

            const response = await fetch("/register", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(user)
            });

            const result = await response.text();

            // Create message area if it doesn't exist
            let messageArea = document.getElementById("messageArea");

            if (!messageArea) {
                messageArea = document.createElement("div");
                messageArea.id = "messageArea";
                document.querySelector(".container").appendChild(messageArea);
            }

            messageArea.innerHTML =
                `<div class="message">${result}</div>`;

        } catch (error) {

            console.error("Error:", error);

            let messageArea = document.getElementById("messageArea");

            if (!messageArea) {
                messageArea = document.createElement("div");
                messageArea.id = "messageArea";
                document.querySelector(".container").appendChild(messageArea);
            }

            messageArea.innerHTML =
                `<div class="message">
                    Failed to register user.
                 </div>`;
        }
    }
</script>
     
</body>
</html>
