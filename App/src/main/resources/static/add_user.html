<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Profile</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f8fafc; }
        header {
            background: #0f172a;
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-link {
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
        }
        .container {
            width: 90%;
            max-width: 600px;
            margin: 35px auto;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }
        textarea { min-height: 90px; resize: vertical; }
        button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <header>
        <h1>Add Profile</h1>
        <a class="btn-link" href="view_product.html">Back</a>
    </header>

    <div class="container">
        <h2>Enter Profile Details</h2>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username" required />
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" />
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        
        <div class="form-group">
            <label>Role</label>
            <input type="text" id="role" placeholder="e.g. ROLE_USER" required />
        </div>
        
        <div class="form-group">
            <label>Mobile</label>
            <input type="tel" id="mobile" placeholder="Enter mobile number" />
        </div>
        
        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="dob" />
        </div>
        
        <div class="form-group">
            <label>Gender</label>
            <select id="gender">
                <option value="MALE">Male</option>
                <option value="FEMALE">Female</option>
                <option value="OTHERS">Other</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Address</label>
            <textarea id="address" placeholder="Enter address"></textarea>
        </div>
        
        <div class="form-group">
            <label>Profile Image URL</label>
            <input type="url" id="dpUrl" placeholder="https://example.com/photo.jpg" />
        </div>
        
        <button onclick="register()">Register User</button>
        <div id="messageArea"></div>
    </div>

<script>
async function register() {
    const messageArea = document.getElementById("messageArea");

    const user = {
        name: document.getElementById("name").value.trim(),
        username: document.getElementById("username").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        role: document.getElementById("role").value.trim(),
        mobile: document.getElementById("mobile").value.trim(),
        dob: document.getElementById("dob").value || null,
        gender: document.getElementById("gender").value,
        address: document.getElementById("address").value.trim(),
        dpUrl: document.getElementById("dpUrl").value.trim()
    };

    try {
        const response = await fetch("/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(user)
        });

        const result = await response.text();

        if (response.ok) {
            messageArea.innerHTML = `<div class="message success">${result}. Redirecting to login...</div>`;
            
            // Redirect to login page after 1.5 seconds
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);
        } else {
            messageArea.innerHTML = `<div class="message error">Error: ${result}</div>`;
        }
    } catch (error) {
        console.error("Error:", error);
        messageArea.innerHTML = `<div class="message error">Failed to connect to the server.</div>`;
    }
}
</script>
</body>
</html>
